<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencia Suspendida | EcoSistem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lock-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .lock-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.3);
        }
        .lock-icon i {
            font-size: 2.5rem;
            color: white;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="lock-card">
        <div class="lock-icon">
            <i class="bi bi-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-white mb-3">Acceso Suspendido</h3>
        <p class="text-white-50 mb-4">
            La licencia de su empresa ha sido <strong class="text-danger">suspendida</strong>. 
            Por favor comuníquese con el administrador del sistema para reactivar su acceso.
        </p>
        <div class="d-flex flex-column gap-2">
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-light rounded-pill px-4">
                <i class="bi bi-arrow-left me-2"></i>Volver al Login
            </a>
        </div>
        <p class="text-white-50 mt-4 mb-0 small opacity-50">EcoSistem — Gestión Inteligente para el Campo</p>
    </div>
</body>
</html>
