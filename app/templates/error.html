{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <!-- Error icon illustration -->
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
        </div>
        
        <h1 class="display-4 fw-bold text-dark mb-3">Error {{ code }}</h1>
        <p class="fs-5 text-muted mb-4">{{ msg }}</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-success btn-lg">
                <i class="bi bi-house-door-fill me-2"></i>Ir al Inicio
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                <i class="bi bi-arrow-left me-2"></i>Volver
            </a>
        </div>
        
        {% if code == 500 %}
        <p class="mt-5 text-muted small">
            El administrador ha sido notificado de este problema.
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
