{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-4.5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-success bg-opacity-10 text-success d-inline-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px;">
                        <i class="bi bi-key-fill fs-3"></i>
                    </div>
                    <h4 class="fw-black mb-1 text-body">Nueva Contraseña</h4>
                    <p class="text-muted small mb-0">Para: <strong class="text-body">{{ email }}</strong></p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold extra-small text-uppercase text-muted">Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="Mínimo 6 caracteres" minlength="6" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold extra-small text-uppercase text-muted">Confirmar Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                            <input type="password" name="password_confirm" class="form-control border-start-0" placeholder="Repite la contraseña" minlength="6" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold shadow-sm py-2.5"
                                style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none;">
                            <i class="bi bi-check2-circle me-1.5"></i>Guardar Contraseña
                        </button>
                    </div>
                </form>

                <div class="text-center pt-3 border-top">
                    <a href="{{ url_for('auth.login') }}" class="text-secondary fw-bold small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Cancelar y volver
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
