{% extends "base.html" %}

{% block content %}
<style>
    .form-header-premium-client {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        border-radius: 2rem;
        padding: 3.5rem;
        margin-bottom: -3rem;
        color: white;
        box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.3);
        position: relative;
        overflow: hidden;
    }

    .glass-form-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 2.5rem;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        position: relative;
        z-index: 10;
        margin-top: 2rem;
    }

    [data-bs-theme="dark"] .glass-form-card {
        background: rgba(30, 41, 59, 0.7);
        border-color: rgba(255, 255, 255, 0.05);
    }
</style>

<div class="container py-4 max-w-4xl mx-auto" style="max-width: 800px;">
    <!-- ENCABEZADO PREMIUM -->
    <div class="form-header-premium-client">
        <div class="d-flex align-items-center gap-3 mb-2">
            <span class="badge rounded-pill bg-white text-primary fw-bold px-3 py-1 shadow-sm">DIRECTORIO</span>
            <span class="text-white text-opacity-75 font-monospace text-uppercase">Nuevo Cliente</span>
        </div>
        <h1 class="display-4 fw-black text-white mb-0" style="letter-spacing: -2px;">Registrar Cliente</h1>
    </div>

    <!-- CARD FORMULARIO -->
    <div class="glass-form-card">
        <div class="card-body p-4 p-md-5">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                
                <div class="mb-4">
                    <label class="form-label text-muted small fw-black text-uppercase mb-2">Nombre o Razón Social <span class="text-danger">*</span></label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-person-fill text-primary"></i></span>
                        <input type="text" name="nombre" class="form-control border-0 fw-bold"
                            placeholder="Ej: Agropecuaria La Finca" required autofocus>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-black text-uppercase mb-2">Documento (CC/NIT)</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-card-text"></i></span>
                            <input type="text" name="documento" class="form-control border-0 fw-bold"
                                placeholder="Ej: 900.123.456">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-black text-uppercase mb-2">Teléfono de Contacto</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="text" name="telefono" class="form-control border-0 fw-bold"
                                placeholder="Ej: 300 123 4567">
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-black text-uppercase mb-2">Correo Electrónico</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-0 fw-bold"
                            placeholder="cliente@email.com">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="form-label text-muted small fw-black text-uppercase mb-2">Ubicación / Dirección</label>
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" name="direccion" class="form-control border-0 fw-bold"
                            placeholder="Ej: Vereda El Hato, Finca 3">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-4 border-top border-primary border-opacity-10">
                    <a href="{{ url_for('ventas.lista_clientes') }}"
                        class="btn btn-link text-muted fw-bold text-decoration-none">
                        <i class="bi bi-arrow-left me-2"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow-lg fw-black hover-lift">
                        GUARDAR CLIENTE <i class="bi bi-check-lg ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
