{% extends "base.html" %}

{% block content %}
<style>
    /* Cabecera Premium */
    .page-header-gradient-client {
        background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        border-radius: 1.5rem;
        padding: 3rem 2.5rem;
        margin-bottom: 2.5rem;
        color: white;
        box-shadow: 0 20px 40px rgba(37, 99, 235, 0.2);
        position: relative;
        overflow: hidden;
    }

    .page-header-gradient-client::before {
        content: '';
        position: absolute;
        top: -20%;
        right: -10%;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        filter: blur(40px);
        pointer-events: none;
    }

    .page-header-gradient-client > * {
        position: relative;
        z-index: 5;
    }

    /* Barra de Herramientas Premium */
    .filter-toolbar {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 2rem;
        padding: 1.25rem 2rem;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
        position: relative;
        z-index: 20;
        /* margin-top: -45px; Removed to fix overlap */
        margin-left: 2rem;
        margin-right: 2rem;
    }

    .search-input {
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        padding: 0.85rem 1.25rem 0.85rem 3.5rem;
        font-size: 1.05rem;
        background-color: #f8fafc;
        font-weight: 500;
        color: #1e293b;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    .search-input:focus {
        background-color: white;
        border-color: #0ea5e9;
        box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
        transform: translateY(-1px);
    }

    [data-bs-theme="dark"] .filter-toolbar {
        background-color: rgba(30, 41, 59, 0.7);
        border-color: rgba(255, 255, 255, 0.05);
    }

    [data-bs-theme="dark"] .search-input {
        background-color: #0f172a;
        border-color: #334155;
        color: #f1f5f9;
    }

    /* Estilos para la tabla Premium */
    .table-modern {
        border-collapse: separate;
        border-spacing: 0 0.85rem;
    }

    .table-modern tbody tr {
        background-color: white;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 1.25rem;
    }

    .table-modern tbody tr:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    }

    [data-bs-theme="dark"] .table-modern tbody tr {
        background-color: #1e293b;
    }

    .table-modern td,
    .table-modern th {
        border: none;
        vertical-align: middle;
        padding: 1.5rem 1.75rem;
    }

    .avatar-client {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 1.4rem;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
    }

    .fade-in-item {
        animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .search-loader {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        display: none;
        color: #0ea5e9;
    }
</style>

<div class="container-fluid py-4 mx-auto" style="max-width: 1400px;">
    <!-- CABECERA PREMIUM -->
    <div class="page-header-gradient-client d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
        <div>
            <h1 class="fw-bolder mb-1" style="letter-spacing: -1px; font-size: 2.5rem;">Directorio de Clientes</h1>
            <p class="text-white text-opacity-75 mb-0 fw-medium fs-5">Gestiona tu cartera de compradores y aliados.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('ventas.nuevo_cliente') }}"
                class="btn btn-light text-primary rounded-pill px-4 py-2 shadow-lg fw-bold fs-6 hover-lift">
                <i class="bi bi-person-plus-fill me-2 fs-5"></i> Nuevo Cliente
            </a>
        </div>
    </div>

    <!-- BARRA DE BÚSQUEDA FLOTANTE -->
    <div class="filter-toolbar mb-4">
        <div class="position-relative">
            <i class="bi bi-search position-absolute text-primary fs-5"
                style="left: 18px; top: 50%; transform: translateY(-50%); z-index: 10;"></i>
            <input type="text" id="dynamicSearch" class="form-control search-input w-100"
                placeholder="Escribe el nombre, documento o correo del cliente..."
                value="{{ search_query if search_query else '' }}" autocomplete="off" autofocus>
            <!-- Spinner de carga -->
            <div class="spinner-border spinner-border-sm search-loader" id="searchLoader" role="status"></div>
        </div>
    </div>

    <div class="table-responsive px-2 pb-5">
        <table class="table table-modern align-middle">
            <thead>
                <tr>
                    <th class="ps-4 text-uppercase text-secondary small fw-bolder border-0 pb-0 pt-2">Cliente / Identificación</th>
                    <th class="text-uppercase text-secondary small fw-bolder border-0 pb-0 pt-2">Información de Contacto</th>
                    <th class="text-uppercase text-secondary small fw-bolder border-0 pb-0 pt-2">Ubicación Registrada</th>
                    <th class="text-end pe-4 text-uppercase text-secondary small fw-bolder border-0 pb-0 pt-2">Gestión</th>
                </tr>
            </thead>
            <tbody id="clientesTableBody">
                {% include 'parciales/items_clientes.html' %}
            </tbody>
        </table>
    </div>
</div>

<!-- SCRIPT DE BÚSQUEDA DINÁMICA (AJAX) -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('dynamicSearch');
        const tableBody = document.getElementById('clientesTableBody');
        const searchLoader = document.getElementById('searchLoader');
        let timeout = null;

        searchInput.addEventListener('input', function (e) {
            const query = e.target.value.trim();

            // Mostrar loader
            searchLoader.style.display = 'block';

            // Debounce: Esperar 300ms antes de enviar la petición al servidor
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                fetch(`{{ url_for('ventas.lista_clientes') }}?q=${encodeURIComponent(query)}&ajax=1`)
                    .then(response => response.text())
                    .then(html => {
                        tableBody.innerHTML = html;
                        searchLoader.style.display = 'none';
                    })
                    .catch(error => {
                        console.error('Error en búsqueda:', error);
                        searchLoader.style.display = 'none';
                    });
            }, 300);
        });
    });
</script>
{% endblock %}
