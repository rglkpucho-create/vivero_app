{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-4.5">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo_ecosistem.svg') }}" alt="EcoSistem"
                         class="rounded-circle shadow-sm border border-2 border-success border-opacity-25 mb-2" style="width: 58px; height: 58px; object-fit: cover;">
                    <h4 class="fw-black mb-1 text-body">EcoSistem</h4>
                    <p class="text-muted small mb-0">Gestión Inteligente de Viveros & Agro</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold extra-small text-uppercase text-muted">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control border-start-0" placeholder="correo@ejemplo.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-bold extra-small text-uppercase text-muted mb-0">Contraseña</label>
                            <a href="{{ url_for('auth.recuperar_password') }}" class="extra-small text-success text-decoration-none fw-bold">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold shadow-sm py-2.5"
                                style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none;">
                            <i class="bi bi-box-arrow-in-right me-1.5"></i>Iniciar Sesión
                        </button>
                    </div>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="text-muted extra-small mb-1">¿Aún no tienes cuenta para tu vivero o finca?</p>
                    <a href="{{ url_for('auth.planes') }}" class="text-success fw-bold small text-decoration-none d-inline-flex align-items-center gap-1">
                        <i class="bi bi-star-fill text-warning"></i>
                        <span>Conoce nuestros planes y precios</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="text-center mt-3 text-muted extra-small">
            <i class="bi bi-whatsapp text-success me-1"></i>Soporte al cliente: 
            <a href="https://wa.me/573000000000?text=Hola!%20Necesito%20ayuda%20con%20mi%20cuenta%20de%20EcoSistem" target="_blank" class="text-muted fw-bold">Escríbenos por WhatsApp</a>
        </div>
    </div>
</div>
{% endblock %}
