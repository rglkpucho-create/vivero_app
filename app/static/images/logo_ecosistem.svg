<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle with glow -->
  <circle cx="60" cy="60" r="54" fill="url(#gradEmerald)" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  
  <!-- Modern Geometric Sprout / Leaf Motif -->
  <!-- Left Leaf -->
  <path d="M 60 76 C 42 76 34 58 38 42 C 48 42 60 52 60 76 Z" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Right Leaf with Vibrant Accent -->
  <path d="M 60 76 C 78 76 86 54 80 36 C 68 36 60 48 60 76 Z" fill="url(#gradLeaf)"/>
  <!-- Stem / Core Growth Pillar -->
  <path d="M 60 88 L 60 62" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Small Center Bud -->
  <circle cx="60" cy="38" r="4.5" fill="#ffffff"/>
</svg>
